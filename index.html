<style>
  body { background:#0f172a; color:#fff; font-family:Arial; text-align:center; }

  button {
    padding:12px 18px; border-radius:10px; border:0;
    background:#22c55e; color:#fff; font-size:16px; margin:20px;
  }

  /* ---- Fan deck ---- */
  .deck {
    position: relative;
    width: 260px;
    height: 140px;
    margin: 0 auto;
  }

  .fan-card {
    position: absolute;
    width: 60px; height: 90px;
    background: #fff;
    border-radius: 8px;
    transform-origin: bottom center;
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
  }

  /* create half-circle fan */
  .fan-card:nth-child(1){ transform: rotate(-40deg) translateY(-10px); }
  .fan-card:nth-child(2){ transform: rotate(-25deg) translateY(-5px); }
  .fan-card:nth-child(3){ transform: rotate(-10deg); }
  .fan-card:nth-child(4){ transform: rotate(5deg); }
  .fan-card:nth-child(5){ transform: rotate(20deg); }
  .fan-card:nth-child(6){ transform: rotate(35deg); }

  /* ---- Drawn cards ---- */
  .table { margin-top: 40px; }

  .card {
    display:inline-flex;
    width:70px; height:100px;
    align-items:center; justify-content:center;
    background:#fff; color:#111;
    border-radius:10px; margin:10px;
    font-weight:bold; font-size:18px;
    transform: translateY(80px);
    opacity:0;
    transition: all .4s ease;
  }

  .show {
    transform: translateY(0);
    opacity:1;
  }
</style>

<h1>🎴 Lucky 3 Cards</h1>

<!-- Fan deck -->
<div class="deck" id="deck">
  <div class="fan-card"></div>
  <div class="fan-card"></div>
  <div class="fan-card"></div>
  <div class="fan-card"></div>
  <div class="fan-card"></div>
  <div class="fan-card"></div>
</div>

<button onclick="draw()">Draw from Deck</button>

<div class="table" id="cards"></div>
<h2 id="result"></h2>

<script>
// full deck
const suits = ["♠","♥","♦","♣"];
const ranks = [
  {r:"A", v:1},
  {r:"2", v:2},
  {r:"3", v:3},
  {r:"4", v:4},
  {r:"5", v:5},
  {r:"6", v:6},
  {r:"7", v:7},
  {r:"8", v:8},
  {r:"9", v:9},
  {r:"10", v:10}
];

function createDeck(){
  let d=[];
  suits.forEach(s=>{
    ranks.forEach(x=>{
      d.push({label:x.r+s, value:x.v});
    });
  });
  return d;
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function draw(){
  let deck = shuffle(createDeck());
  let picked = deck.slice(0,3);

  let wrap = document.getElementById("cards");
  wrap.innerHTML="";

  picked.forEach((c,i)=>{
    let el = document.createElement("div");
    el.className="card";
    el.innerText=c.label;
    wrap.appendChild(el);

    setTimeout(()=>{
      el.classList.add("show");
    }, i*200);
  });

  let sum = picked.reduce((a,c)=>a+c.value,0);
  let result = sum % 10;

  setTimeout(()=>{
    document.getElementById("result").innerText="Result: "+result;
  },700);
}
</script>
